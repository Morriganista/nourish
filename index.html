<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nourish</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{
  --bg:#13161E;--surface:#1C2030;--card:#242838;--border:#323850;
  --green:#4DD871;--gd:#277A3C;--gl:#172B1E;--gt:#AEFFC8;
  --gold:#FFD166;--coral:#FF8C69;
  --pt:#FF8C69;--bt:#7EC8FF;--put:#C4BAFF;--pul:#2A2650;--purple:#9B8FFF;
  --text:#F2F0FF;--soft:#6B7399;--mid:#9BA3C4;--r:16px;
}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;max-width:430px;margin:0 auto;height:100%}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:100px}
#scroll::-webkit-scrollbar{display:none}

/* ── Nav bar ── */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:10px 8px 24px;z-index:100;backdrop-filter:blur(12px)}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-size:10px;font-weight:800;padding:4px 10px;border-radius:12px;color:var(--soft);transition:color .18s;flex:1}
.nb.on{color:var(--green)}
.fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#277A3C,#1E5C2C);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:-20px;color:var(--gt);box-shadow:0 4px 16px rgba(77,216,113,.25)}
.fab:active{transform:scale(.93)}

/* ── Cards & layout ── */
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--border);margin-bottom:12px}
.sec{font-size:11px;font-weight:800;color:var(--mid);text-transform:uppercase;letter-spacing:.1em;margin:20px 0 10px}
.screen{padding:20px 16px 8px;animation:fadeUp .22s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── Home header ── */
.home-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.home-greeting{font-size:26px;font-weight:900;letter-spacing:-.3px;line-height:1.1}
.home-sub{font-size:13px;color:var(--soft);margin-top:3px;font-weight:600}

/* ── Mood ── */
.mood-row{display:flex;gap:6px}
.mb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 2px;border-radius:14px;border:2px solid transparent;background:var(--bg);cursor:pointer;transition:all .18s;font-family:'Nunito',sans-serif}
.mb .ml{font-size:9px;font-weight:800;color:var(--soft);letter-spacing:.02em}
.mb:active{transform:scale(.95)}

/* ── Meal cards ── */
.mc{background:var(--card);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid var(--border);transition:border-color .18s}
.mc:active{border-color:var(--coral)}
.mi{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;border:none;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:all .18s;letter-spacing:.01em}
.btn:active{transform:scale(.97)}
.btn-g{background:linear-gradient(135deg,#2D8F46,#1E6B34);color:#AEFFC8;width:100%;box-shadow:0 2px 12px rgba(77,216,113,.2)}
.btn-o{background:transparent;border:1.5px solid var(--border);color:var(--mid);width:100%;font-weight:700}
.btn-c{background:var(--pul);border:1.5px solid rgba(196,186,255,.2);color:var(--put);width:100%;font-weight:700}

/* ── Chips ── */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:8px 14px;border-radius:100px;border:1.5px solid var(--border);background:var(--card);font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;color:var(--soft);display:flex;align-items:center;gap:6px;transition:all .18s}
.chip.sel{border-color:var(--green);background:var(--gl);color:var(--gt)}

/* ── Inputs ── */
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:13px;font-family:'Nunito',sans-serif;font-size:14px;color:var(--text);background:var(--card);outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--green)}
.lbl{font-size:12px;font-weight:800;color:var(--soft);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.06em}
.ig{margin-bottom:14px}

/* ── Ingredient rows ── */
.ir{display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:12px;padding:10px 13px;margin-bottom:7px;border:1px solid var(--border)}
.ir-name{flex:1;font-size:13px;font-weight:700;color:var(--text)}
.ir-amt{font-size:11px;color:var(--soft);background:var(--card);padding:3px 8px;border-radius:100px;border:1px solid var(--border)}
.ir-del{background:none;border:none;cursor:pointer;color:var(--soft);padding:4px;display:flex;align-items:center;opacity:.7;transition:opacity .18s}
.ir-del:hover{opacity:1}

/* ── Search results ── */
.sr{display:flex;align-items:center;gap:12px;padding:12px 13px;background:var(--card);border-radius:13px;margin-bottom:7px;cursor:pointer;border:1.5px solid transparent;transition:all .18s}
.sr:hover,.sr:active{border-color:var(--green);background:#1E2E1E}
.sr-name{font-weight:800;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Bottom sheet ── */
.moverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.msheet{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:430px;padding:20px 20px 44px;max-height:90vh;overflow-y:auto;border-top:1px solid var(--border)}
.msheet::-webkit-scrollbar{display:none}
.mhandle{width:40px;height:4px;background:var(--border);border-radius:100px;margin:0 auto 18px}
.mtitle{font-size:20px;font-weight:900;margin-bottom:16px;letter-spacing:-.3px}

/* ── Insights bars ── */
.brow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.blbl{width:65px;font-size:12px;font-weight:700;color:var(--soft)}
.bbg{flex:1;height:7px;background:var(--border);border-radius:100px;overflow:hidden}
.bb{height:100%;border-radius:100px}
.bval{font-size:11px;color:var(--soft);width:36px;text-align:right}
.wm{display:flex;gap:4px;justify-content:space-between}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px}
.wdl{font-size:9px;color:var(--soft);font-weight:800;text-transform:uppercase;letter-spacing:.05em}

/* ── Affirmation ── */
.aff{background:linear-gradient(135deg,rgba(42,38,80,.8),rgba(30,26,60,.8));border-radius:14px;padding:16px;text-align:center;border:1px solid rgba(196,186,255,.15);margin-top:8px}
.aff p{font-size:14px;font-weight:700;line-height:1.6;color:var(--put)}

/* ── Misc ── */
.mpills{display:flex;gap:6px;margin-top:8px}
.mp{flex:1;border-radius:10px;padding:7px 5px;text-align:center}
.mp .mv{font-weight:800;font-size:13px}
.mp .mk{font-size:10px;color:var(--soft)}
.empty{text-align:center;padding:32px 0;color:var(--soft)}
.empty .et{font-weight:800;font-size:14px;color:var(--mid)}
.empty .es{font-size:12px;margin-top:5px;line-height:1.5}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.src-tag{font-size:9px;font-weight:800;padding:2px 8px;border-radius:100px;display:inline-block;margin-top:4px}
.tag-off{background:var(--gl);color:var(--gt)}
.tag-local{background:#2D2A42;color:#C4BAFF}
.tag-custom{background:#2A1800;color:#FFB347}
.macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.macro-grid .ig{margin-bottom:0}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1E6B34,#277A3C);color:#AEFFC8;padding:11px 22px;border-radius:100px;font-size:13px;font-weight:800;z-index:300;animation:toastIn .3s ease;white-space:nowrap;pointer-events:none;box-shadow:0 4px 16px rgba(77,216,113,.3)}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.cf-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:11px;margin-bottom:6px;border:1px solid var(--border)}
.cf-name{flex:1;font-size:13px;font-weight:700;color:var(--text)}
.err-box{color:#FF6B6B;font-size:13px;font-weight:700;margin-bottom:12px;padding:11px 14px;background:rgba(255,107,107,.1);border-radius:12px;border:1px solid rgba(255,107,107,.2)}
.mode-toggle{display:flex;background:var(--bg);border-radius:100px;padding:3px;margin-bottom:16px;border:1px solid var(--border)}
.mode-btn{flex:1;padding:8px;border:none;border-radius:100px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;cursor:pointer;background:transparent;color:var(--soft);transition:all .18s}
.mode-btn.on{background:var(--card);color:var(--text);box-shadow:0 1px 6px rgba(0,0,0,.4)}
.portion-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.portion-tile{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px 10px;cursor:pointer;text-align:center;transition:all .18s;font-family:'Nunito',sans-serif}
.portion-tile:active{transform:scale(.95);border-color:var(--green)}
.portion-tile:hover{border-color:var(--green);background:var(--gl)}
.portion-icon{font-size:24px;margin-bottom:6px}
.portion-label{font-size:12px;font-weight:800;color:var(--text);margin-bottom:2px}
.portion-sub{font-size:10px;color:var(--soft)}
.num-toggle{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:100px;padding:7px 13px 7px 9px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;color:var(--soft);transition:all .2s}
.num-toggle.on{border-color:rgba(196,186,255,.5);color:var(--put);background:var(--pul)}
.toggle-dot{width:8px;height:8px;border-radius:50%;background:var(--soft);transition:background .2s;flex-shrink:0}
.num-toggle.on .toggle-dot{background:var(--put)}
.variety-row{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
.vdot{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--mid)}
.vdot-circle{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.week-bar-soft{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.wbs-lbl{font-size:12px;font-weight:700;color:var(--soft);width:65px}
.wbs-track{flex:1;height:7px;background:var(--border);border-radius:100px;overflow:hidden}
.wbs-fill{height:100%;border-radius:100px;opacity:.8}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px}
.loading-screen .spin{width:24px;height:24px;border-width:3px}

function applyLock(d){
  if(!d)return;
  LOCK={loaded:true,has:!!d.has_safe_word,on:!!d.numbers_on,unlockAt:d.unlock_at?new Date(d.unlock_at).getTime():null,resetAt:d.reset_at?new Date(d.reset_at).getTime():null,serverNow:new Date(d.server_now).getTime(),fetchedAt:Date.now()};

async function loadLock(){
  try{const{data,error}=await supa.rpc('lock_status');if(error)throw error;applyLock(data);}
  catch(e){LOCK.loaded=false;showNums=false;}
}
function lockNow(){return LOCK.serverNow+(Date.now()-LOCK.fetchedAt);}
function lockRemainingMs(){return LOCK.unlockAt==null?null:LOCK.unlockAt-lockNow();}
function resetRemainingMs(){return LOCK.resetAt==null?null:LOCK.resetAt-lockNow();}
function lockMsg(e){
  const m=((e&&e.message)||'').toLowerCase();
  if(m.includes('wrong safe word'))return "That isn't your safe word.";
  if(m.includes('too short'))return 'Please use at least 4 characters.';
  if(m.includes('already set'))return 'A safe word is already set for this account.';
  if(m.includes('reset not ready'))return 'The waiting time is not over yet.';
  return 'Something went wrong. Numbers stay as they are. Please try again.';
}
async function lockCall(fn,args,after){
  lockUi.busy=true;lockUi.err='';render();

}

/* ── SMART SEARCH
   Priority order:
   1. Custom foods (exact + partial)
   2. Local foods (exact first, then partial, scored by match position)
   3. OFF (packaged goods) — only if local gives fewer than 5 hits
   This means tomato, egg, onion always surface before packaged stuff.
── */
function stems(lq){
  const s=[lq];
  if(lq.endsWith('ies')&&lq.length>4)s.push(lq.slice(0,-3)+'y');
  else if(lq.endsWith('es')&&lq.length>3)s.push(lq.slice(0,-2),lq.slice(0,-1));
  else if(lq.endsWith('s')&&lq.length>2)s.push(lq.slice(0,-1));
  return s;
}
function scoreLocal(f,lq){
  const n=f.name.toLowerCase();
  const qs=stems(lq);
  for(const q of qs){
    if(n===q)return 100;
    if(n.startsWith(q))return 80;
    if(n.includes(' '+q))return 60;
    if(n.includes(q))return 40;
  }
  return 0;
}

async function fetchFoods(q){
  const lq=q.toLowerCase().trim();
  // custom first
  const mc=CF.filter(f=>f.name.toLowerCase().includes(lq));
  // local, scored and sorted
  const ml=LF.map(f=>({f,s:scoreLocal(f,lq)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.f);
  const combined=[...mc,...ml];
  // only call OFF if local gives few results and query is long enough
  if(combined.length>=5||lq.length<2)return combined.slice(0,10);
  try{
    const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=8&fields=product_name,brands,nutriments`);
    const d=await r.json();
    const remote=(d.products||[]).filter(p=>p.product_name&&p.nutriments&&(p.nutriments['energy-kcal_100g']||p.nutriments['energy_100g'])).slice(0,6).map((p,i)=>{
      const n=p.nutriments,fid='off_'+i+'_'+Date.now();
      const food={id:fid,name:p.product_name+(p.brands?` · ${p.brands.split(',')[0]}`:''),i:'leaf',src:'off',p100:{en:Math.round(n['energy-kcal_100g']||(n['energy_100g']||0)/4.184||0),pr:round(n['proteins_100g']||0),ca:round(n['carbohydrates_100g']||0),fa:round(n['fat_100g']||0),fi:round(n['fiber_100g']||0)}};
      ST.fmap[fid]=food;return food;
    });
    return[...combined,...remote].slice(0,10);
  }catch(e){return combined.slice(0,10);}
}

function defaultResults(){
  const cf=CF.slice(0,3);

function onSI(val){

function nav(s){if(ST.scr==='scan')stopScan();ST.scr=s;render();}
let _scanner=null;

async function startScan(){
  if(_scanner)return;
  const el=$('qr-reader');if(!el)return;
  try{
    _scanner=new Html5Qrcode('qr-reader');
    await _scanner.start(
      {facingMode:'environment'},
      {fps:10,qrbox:{width:220,height:220},aspectRatio:1},
      (code)=>{handleBarcode(code);},
      ()=>{}
    );
    ST.scan.active=true;
  }catch(e){
    _scanner=null;
    ST.scan.err=e&&e.toString().includes('Permission')?
      'Camera access denied — please allow camera in your browser settings.' :
      'Could not start camera. Try the manual entry below.';
    render();
  }
}

function stopScan(){
  if(_scanner){
    _scanner.stop().catch(()=>{});
    _scanner=null;
  }
  ST.scan.active=false;
}

async function handleBarcode(code){
  stopScan();
  ST.scan.result={loading:true,code};render();
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
    const d=await r.json();
    if(d.status===1&&d.product){
      const p=d.product,n=p.nutriments||{};
      const fid='sc_'+code;
      const food={id:fid,name:p.product_name||'Scanned product',i:'leaf',src:'off',
        p100:{en:Math.round(n['energy-kcal_100g']||(n['energy_100g']||0)/4.184||0),
          pr:round(n['proteins_100g']||0),ca:round(n['carbohydrates_100g']||0),
          fa:round(n['fat_100g']||0),fi:round(n['fiber_100g']||0)}};
      const hasNutrition=Object.values(food.p100).some(v=>v>0);
      if(!hasNutrition){ST.scan.result={found:false,noNutrition:true,code,name:p.product_name||''};}
      else{ST.fmap[fid]=food;ST.scan.result={found:true,food};}
    }else{ST.scan.result={found:false,code};}
  }catch(e){ST.scan.result={error:true,code};}
  render();
}

function fireMoodEffect(v){
  const cfg={
    1:{count:12,colours:['#8A9AB5','#6B7A9A','#A0AABB'],dist:30,size:[3,5],dur:[400,600],shape:'drift'},
    2:{count:18,colours:['#5B9FE0','#4A8ED0','#7EC8FF'],dist:45,size:[3,6],dur:[500,700],shape:'rain'},
    3:{count:22,colours:['#52B87A','#3FA066','#6FD494'],dist:50,size:[4,6],dur:[500,700],shape:'spiral'},
    4:{count:30,colours:['#4DD871','#3BC45E','#7FEB9A','#AEFFC8'],dist:70,size:[4,7],dur:[550,750],shape:'burst'},
    5:{count:38,colours:['#FFD166','#4DD871','#7EC8FF','#FF8C69','#C4BAFF','#FF6B9D'],dist:90,size:[4,8],dur:[600,1000],shape:'burst'},
  };
  const c=cfg[v];if(!c)return;
  for(let p=0;p<c.count;p++){
    const el=document.createElement('div');
    const col=c.colours[Math.floor(Math.random()*c.colours.length)];
    const size=c.size[0]+Math.random()*(c.size[1]-c.size[0]);
    const dur=c.dur[0]+Math.random()*(c.dur[1]-c.dur[0]);
    const startX=Math.random()*320+20;
    const startY=Math.random()*160+60;
    let tx=0,ty=0;
    if(c.shape==='burst'){
      const angle=Math.random()*Math.PI*2;
      const dist=c.dist*0.4+Math.random()*c.dist*0.6;
      tx=Math.cos(angle)*dist;ty=Math.sin(angle)*dist;
    }else if(c.shape==='rain'){
      tx=(Math.random()-0.5)*40;ty=c.dist+Math.random()*20;
    }else if(c.shape==='drift'){
      tx=(Math.random()-0.5)*c.dist;ty=-(10+Math.random()*c.dist*0.5);
    }else if(c.shape==='spiral'){
      const angle=(p/c.count)*Math.PI*4;
      const dist=(p/c.count)*c.dist;
      tx=Math.cos(angle)*dist;ty=Math.sin(angle)*dist;
    }
    const isSquare=v===3&&Math.random()>0.5;
    el.style.cssText=`position:fixed;left:${startX}px;top:${startY}px;width:${size}px;height:${size}px;border-radius:${isSquare?'2px':'50%'};background:${col};pointer-events:none;z-index:999;opacity:1;transition:transform ${dur}ms cubic-bezier(.2,.8,.4,1),opacity ${dur}ms ease-out`;
    document.body.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transform=`translate(${tx}px,${ty}px) scale(0.15)`;
      el.style.opacity='0';
    }));
    setTimeout(()=>el.remove(),dur+100);
  }
}

  /* ── Journal card ── */

      ${broccoliSvg(n.v,n.c,26)}
      <span style="font-size:9px;font-weight:800;color:${sel?n.c:'var(--soft)'};letter-spacing:.01em">${n.l}</span>
    </button>`;

  const journalCard=`<div class="card" style="margin-bottom:12px">
    <div style="font-weight:800;font-size:14px;margin-bottom:14px;display:flex;align-items:center;gap:7px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="url(#jgrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="jgrad" x1="0%" y1="0%" x2="100%" y2="100%">

      </svg>
      Today's journal
    </div>
    ${moodData?`<div style="display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 13px;margin-bottom:14px;border:1px solid ${moodData.c}30">
      <span style="color:${moodData.c}">${ico(moodData.k,24)}</span>
      <div>
        <div style="font-size:12px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px">Mood</div>
        <div style="font-size:14px;font-weight:800;color:${moodData.c}">${moodData.l}</div>
      </div>
    </div>`:`<div style="font-size:12px;color:var(--soft);margin-bottom:14px;padding:10px 13px;background:var(--bg);border-radius:12px;border:1px solid var(--border)">No mood logged yet — tap a face above 👆</div>`}
    <div style="font-size:11px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px">How nourished do you feel today?</div>
    <div style="display:flex;gap:5px">${nBtns}</div>
  </div>`;
  return`<div class="screen">
    <div class="home-header">
      <div>
        <div class="home-greeting">${greet()}</div>
        <div class="home-sub">How are you feeling right now?</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${toggleBtn}
        <svg width="32" height="32" viewBox="0 0 80 80" style="flex-shrink:0">
          <defs>
            <linearGradient id="hheart" x1="0%" y1="0%" x2="100%" y2="110%">
              <stop offset="0%" stop-color="#4DD871"/>
              <stop offset="55%" stop-color="#FFD166"/>
              <stop offset="100%" stop-color="#FF8C69"/>
            </linearGradient>
          </defs>
          <circle cx="40" cy="40" r="38" fill="#1E1A0D" stroke="#FF8C69" stroke-width="1" stroke-opacity=".2"/>
          <path d="M40 59C40 59 21 47 21 33c0-8 6.5-13 13-10 3 1.4 4.5 3.5 6 5.5 1.5-2 3-4.1 6-5.5 6.5-3 13 2 13 10 0 14-19 26-19 26z" fill="url(#hheart)" fill-opacity=".25" stroke="url(#hheart)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="40" y1="59" x2="40" y2="43" stroke="#4DD871" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div style="font-size:11px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px">How are you today?</div>
      <div class="mood-row">${mBtns}</div>
    </div>
    ${nourish}

    <div class="card" style="margin-bottom:12px">

      </div>
      ${mCards}

}

function rAdd(){
  const{type,ings,modal}=ST.add;
  const tBtns=MT.map(t=>`<button class="chip ${type===t.id?'sel':''}" onclick="setMT('${t.id}')" style="${type===t.id?`color:${t.c};border-color:${t.c};background:${t.bg}`:''}"><span style="color:${type===t.id?t.c:'#555'}">${ico(t.i,14)}</span>${t.l}</button>`).join('');
  const mt=MT.find(t=>t.id===type)||MT[1];

  /* ── RECIPES SHELF ── only when no ingredients yet ── */
  const rcpShelf=RCP.length>0&&ings.length===0?`
    <div class="sec" style="margin-top:4px">Quick start from a recipe</div>
    ${RCP.map(r=>{
      const rmt=MT.find(t=>t.id===r.type)||MT[1];
      const rnames=r.ings.map(i=>i.food.name.split(' · ')[0]).join(', ');
      return`<div style="display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--border)">
        <div style="width:36px;height:36px;border-radius:10px;background:${rmt.bg};color:${rmt.c};display:flex;align-items:center;justify-content:center;flex-shrink:0">${ico(rmt.i,16)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:13px;color:var(--text);margin-bottom:2px">${r.name}</div>
          <div style="font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rnames}</div>
        </div>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn btn-g" style="padding:7px 14px;font-size:12px;width:auto" onclick="loadRecipe('${r.id}')">Use</button>
          <button style="background:none;border:none;cursor:pointer;color:var(--soft);padding:6px" onclick="delRecipe('${r.id}')">${ico('trash',14)}</button>
        </div>
      </div>`;
    }).join('')}
    <div style="border-top:1px solid var(--border);margin:16px 0"></div>
  `:'';

  /* ── INGREDIENTS LIST ── */
  const iList=ings.length===0
    ?`<div class="empty" style="padding:14px 0"><div style="color:var(--green);display:flex;justify-content:center;margin-bottom:6px">${ico('leaf',28)}</div><div class="et" style="font-size:13px">No ingredients yet</div></div>`
    :ings.map(i=>`<div class="ir"><span style="color:${mt.c}">${ico(i.food.i||'leaf',16)}</span><span class="ir-name">${i.food.name.split(' · ')[0]}</span><span class="ir-amt">${i.rough?i.da:(showNums?`${i.da}${i.du}`:'')}</span><button class="ir-del" onclick="removeIng(${i.id})">✕</button></div>`).join('');

  /* ── VARIETY HINT ── */
  let varietyHint='';
  if(ings.length>0){
    const v=getVariety([{ings}]);
    const present=VGROUPS.filter(g=>v[g.k]);
    if(present.length)varietyHint=`<div style="margin-bottom:12px;padding:10px 13px;background:var(--bg);border-radius:10px;border:1px solid var(--border)">
      <div style="font-size:10px;font-weight:800;color:var(--soft);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em">What's in this meal</div>
      <div class="variety-row" style="margin-top:0">${present.map(g=>`<div class="vdot"><div class="vdot-circle" style="background:${g.col}"></div>${g.label}</div>`).join('')}</div>
    </div>`;
  }

  const ov=modal?rModal():'';

  return`<div class="screen">
    <div style="font-size:24px;font-weight:800;margin-bottom:2px">Add a meal</div>
    <div style="font-size:13px;color:var(--soft);margin-bottom:18px">What did you nourish yourself with?</div>

    <div class="sec" style="margin-top:0">Meal type</div>
    <div class="chips">${tBtns}</div>

    ${rcpShelf}

    <div class="sec">Build your meal</div>
    <div style="margin-bottom:10px">${iList}</div>
    ${varietyHint}

    <div style="display:flex;gap:9px;margin-bottom:8px">
      <button class="btn btn-o" style="flex:2" onclick="openModal()">
        <span style="color:var(--green)">${ico('plus',15)}</span>Add ingredient
      </button>
      <button class="btn btn-o" style="flex:1;font-size:12px" onclick="nav('scan')">
        <span style="color:var(--bt)">${ico('cam',15)}</span>Scan
      </button>
    </div>

    ${ings.length>0?`
      <div style="border-top:1px solid var(--border);margin:14px 0 14px"></div>
      <button class="btn btn-g" onclick="saveMeal()">
        <span>${ico('check',16)}</span>Save meal
      </button>
    `:''}

  </div>${ov}`;
}

function rModal(){
  if(ST.modal==='create')return rCreateModal();
  if(ST.modal==='amount')return rAmtModal();
  if(ST.modal==='saved')return rSavedModal();
  if(ST.modal==='name-recipe')return rNameRecipeModal();
  if(ST.modal==='none')return '';
  return rSearchModal();
}

function rSavedModal(){
  const mt=MT.find(t=>t.id===ST.add.type)||MT[1];
  const names=ST.add.ings.map(i=>i.food.name.split(' · ')[0]).join(', ');
  return`<div class="moverlay"><div class="msheet" style="text-align:center">
    <div class="mhandle"></div>
    <div style="color:var(--green);display:flex;justify-content:center;margin-bottom:14px">${ico('check',38)}</div>
    <div style="font-size:19px;font-weight:800;margin-bottom:6px">Meal saved</div>
    <div style="font-size:13px;color:var(--soft);margin-bottom:6px;text-transform:capitalize">${mt.l}</div>
    <div style="font-size:12px;color:var(--soft);margin-bottom:24px;line-height:1.6">${names}</div>
    <button class="btn btn-c" onclick="ST.modal='name-recipe';render()" style="margin-bottom:8px">
      <span style="color:var(--put)">${ico('edit',16)}</span>Save as a recipe
    </button>
    <button class="btn btn-g" onclick="ST.add={type:'lunch',ings:[],modal:false,selFood:null,amt:'100',unit:'g'};nav('home')">
      <span>${ico('home',16)}</span>Back home

}

function rNameRecipeModal(){

    <div class="mtitle">Name this recipe</div>

  return`<div class="moverlay" onclick="if(event.target===this)closeModal()"><div class="msheet"><div class="mhandle"></div><div class="mtitle">Find an ingredient</div><div class="ig" style="position:relative"><span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--soft)">${ico('search',15)}</span><input class="inp" id="sfq" placeholder="e.g. tomato, egg, oats…" value="${ST.sq}" style="padding-left:38px" oninput="onSI(this.value)" autocomplete="off" spellcheck="false"></div><div style="font-size:10px;color:var(--soft);margin:-6px 0 10px;padding-left:2px">90 whole foods built in · packaged goods via barcode scan</div><div id="sr-list">${rResults(init)}</div><hr class="divider"><button class="btn btn-c" onclick="openCreate()"><span style="color:var(--put)">${ico('edit',16)}</span>Create custom food</button><button class="btn btn-o" style="margin-top:8px" onclick="closeModal()"><span>${ico('back',16)}</span>Cancel</button></div></div>`;
}

function rAmtModal(){
  const{selFood,amt,unit,portionMode}=ST.add;
  const mt=MT.find(t=>t.id===ST.add.type)||MT[1];
  const foodCard=`<div style="background:var(--gl);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px;border:1px solid rgba(77,216,113,.15)">
    <span style="color:${mt.c}">${ico(selFood.i||'leaf',28)}</span>
    <div>
      <div style="font-weight:800;font-size:14px">${selFood.name.split(' · ')[0]}</div>
      ${selFood.src==='off'&&selFood.name.includes(' · ')?`<div style="font-size:11px;color:var(--soft)">${selFood.name.split(' · ')[1]}</div>`:''}
      ${srcTag(selFood.src)}
    </div>
  </div>`;

  const modeToggle=`<div class="mode-toggle">
    <button class="mode-btn ${portionMode==='rough'?'on':''}" onclick="ST.add.portionMode='rough';render()">Rough portion</button>
    <button class="mode-btn ${portionMode==='precise'?'on':''}" onclick="ST.add.portionMode='precise';render()">Precise amount</button>
  </div>`;

  const roughPanel=`
    <div style="font-size:12px;color:var(--soft);margin-bottom:12px;line-height:1.6">
      Choose roughly how much — no weighing needed.
    </div>
    <div class="portion-grid">
      ${PORTIONS.map((p,i)=>`
        <div class="portion-tile" onclick="addIngPortion(${i})">
          <div class="portion-icon">${p.icon}</div>
          <div class="portion-label">${p.label}</div>
          <div class="portion-sub">${p.sub}</div>
        </div>`).join('')}
    </div>`;

  const precisePanel=`
    <div class="ig"><label class="lbl">How much?</label>
      <div style="display:flex;gap:8px">
        <input class="inp" type="number" value="${amt}" min="1" style="flex:1" oninput="ST.add.amt=this.value">
        <select style="padding:10px;border:1.5px solid var(--border);border-radius:12px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;background:var(--card);color:var(--text);outline:none;cursor:pointer" onchange="ST.add.unit=this.value">
          <option value="g" ${unit==='g'?'selected':''}>g</option>
          <option value="ml" ${unit==='ml'?'selected':''}>ml</option>
          <option value="oz" ${unit==='oz'?'selected':''}>oz</option>
          <option value="piece" ${unit==='piece'?'selected':''}>piece</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-o" style="flex:1" onclick="ST.modal='search';render()"><span>${ico('back',16)}</span>Back</button>
      <button class="btn btn-g" style="flex:2" onclick="addIng()"><span>${ico('check',16)}</span>Add</button>
    </div>`;

  return`<div class="moverlay" onclick="if(event.target===this)closeModal()"><div class="msheet">
    <div class="mhandle"></div>
    <div class="mtitle">How much ${selFood.name.split(' · ')[0]}?</div>
    ${foodCard}
    ${modeToggle}
    ${portionMode==='rough'?roughPanel:precisePanel}
    <button class="btn btn-o" style="margin-top:8px" onclick="ST.modal='search';render()"><span>${ico('back',16)}</span>Back</button>
  </div></div>`;

function rCreateModal(){
  const c=ST.cr;
  const nf=(id,lbl,ph,val,field)=>`<div class="ig"><label class="lbl">${lbl}</label><input class="inp" id="${id}" type="number" min="0" step="0.1" placeholder="${ph}" value="${val}" style="text-align:right" oninput="ST.cr.${field}=this.value"></div>`;
  return`<div class="moverlay" onclick="if(event.target===this)closeModal()"><div class="msheet"><div class="mhandle"></div><div class="mtitle">Create a custom food</div><div style="font-size:13px;color:var(--soft);margin-bottom:16px;line-height:1.6">Homemade, a family recipe, a local product — add it once and it lives in your list.</div><div class="ig"><label class="lbl">Food name</label><input class="inp" id="cfn" type="text" placeholder="e.g. Grandma's lasagna" value="${c.name}" oninput="ST.cr.name=this.value" autocomplete="off"></div><div class="sec" style="margin-top:4px">Nutrition per 100g / 100ml</div><div class="macro-grid">${nf('cfe','Calories (kcal)','e.g. 210',c.en,'en')}${nf('cfp','Protein (g)','e.g. 12',c.pr,'pr')}${nf('cfc','Carbs (g)','e.g. 24',c.ca,'ca')}${nf('cff','Fat (g)','e.g. 8',c.fa,'fa')}</div><div class="ig"><label class="lbl">Fiber (g) <span style="font-weight:400;color:var(--soft)">optional</span></label><input class="inp" type="number" min="0" step="0.1" placeholder="e.g. 3" value="${c.fi}" style="text-align:right" oninput="ST.cr.fi=this.value"></div>${c.err?`<div class="err-box">${c.err}</div>`:''}<button class="btn btn-g" onclick="saveCustom()" style="margin-bottom:8px"><span>${ico('check',16)}</span>Save to my foods</button><button class="btn btn-o" onclick="backToSearch()"><span>${ico('back',16)}</span>Back to search</button>${CF.length>0?`<hr class="divider"><div class="sec" style="margin-top:0">My saved foods</div>${CF.map(f=>`<div class="cf-row"><span style="color:var(--put)">${ico('leaf',16)}</span><span class="cf-name">${f.name}</span>${showNums?`<span style="font-size:11px;color:var(--soft);margin-right:8px">${f.p100.en} kcal</span>`:''}<button class="cf-del" onclick="delCustom('${f.id}')">${ico('trash',15)}</button></div>`).join('')}`:''}  </div></div>`;
}

function rScan(){
  const{result,err}=ST.scan;
  setTimeout(()=>{if(!ST.scan.active&&!result)startScan();},180);
  return`<div class="screen">
    <div style="font-size:24px;font-weight:800;margin-bottom:2px;display:flex;align-items:center;gap:10px">
      <span style="color:var(--bt)">${ico('cam',26)}</span>Scan barcode
    </div>
    <div style="font-size:13px;color:var(--soft);margin-bottom:16px">Point your camera at a product barcode</div>

    ${!result?`
      <div id="qr-reader" style="width:100%;border-radius:var(--r);overflow:hidden;background:#0D0F13;min-height:260px"></div>
      <div style="font-size:11px;color:var(--soft);text-align:center;margin-top:8px;margin-bottom:4px">Needs HTTPS — works after deploying to Vercel</div>
    `:''}

    ${err?`<div style="color:#E05050;text-align:center;padding:10px 0;font-weight:700;font-size:13px">${err}</div>`:''}

    <div style="margin-top:14px">
      <div class="sec" style="margin-top:0">Or enter barcode manually</div>
      <div style="display:flex;gap:8px">
        <input class="inp" id="mbc" placeholder="e.g. 8718452099631" style="flex:1">
        <button class="btn btn-g" style="flex:0 0 auto" onclick="handleBarcode($('mbc').value)">${ico('check',16)}</button>
      </div>
    </div>

    ${result?rSR(result):''}

    <div style="margin-top:14px">
      <button class="btn btn-o" onclick="nav('add')"><span>${ico('back',16)}</span>Back to meal</button>
    </div>
  </div>`;
}
function rSR(r){
  if(r.loading)return`<div class="card" style="margin-top:14px;text-align:center;padding:24px"><span class="spin"></span><span style="font-weight:800"> Looking up…</span></div>`;
  if(r.noNutrition)return`<div class="card" style="margin-top:14px;text-align:center;padding:24px"><div style="color:var(--soft);margin-bottom:8px">${ico('leaf',32)}</div><div style="font-weight:800">${r.name?r.name.replace(/</g,'&lt;'):'This product'} is in the database, but without nutrition information</div><div style="font-size:12px;color:var(--soft);margin-top:6px;line-height:1.5">You can add it as your own food instead.</div><button class="btn btn-g" style="margin-top:12px" onclick="createFromScan()"><span>${ico('check',16)}</span>Add it as my own food</button><button class="btn btn-o" style="margin-top:8px" onclick="nav('add')"><span>${ico('back',16)}</span>Search manually</button></div>`;
  if(r.error||!r.found)return`<div class="card" style="margin-top:14px;text-align:center;padding:24px"><div style="color:var(--soft);margin-bottom:8px">${ico('leaf',32)}</div><div style="font-weight:800">${r.error?'Could not connect':'Product not found'}</div><button class="btn btn-o" style="margin-top:12px" onclick="nav('add')"><span>${ico('back',16)}</span>Search manually</button></div>`;
  const f=r.food;const numBlock=showNums?`<div class="mpills"><div class="mp" style="background:#0C2140"><div class="mv" style="color:#85B7EB">${f.p100.pr}g</div><div class="mk">protein</div></div><div class="mp" style="background:#251800"><div class="mv" style="color:#EF9F27">${f.p100.ca}g</div><div class="mk">carbs</div></div><div class="mp" style="background:#2A1208"><div class="mv" style="color:#F0997B">${f.p100.fa}g</div><div class="mk">fat</div></div><div class="mp" style="background:#1B2E1F"><div class="mv" style="color:#97C459">${f.p100.fi}g</div><div class="mk">fiber</div></div></div>`:'';
  return`<div class="card" style="margin-top:14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="color:var(--green)">${ico('leaf',30)}</span><div><div style="font-weight:800;font-size:15px">${f.name}</div><span class="src-tag tag-off">Open Food Facts</span></div></div>${numBlock}<button class="btn btn-g" style="margin-top:10px" onclick="addScanned()"><span>${ico('check',16)}</span>Add to meal</button></div>`;
}

function rInsights(){
  return rInsightsClient();
}

function rInsightsClient(){
  const allEntryDates=[...new Set([
    ...ST.moods.map(m=>m.date),
    ...ST.nourished.map(n=>n.date),
    ...ST.meals.map(m=>m.date),
  ])];

  // Last 14 days logged
  const days14=[];
  for(let i=13;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    days14.push(ds);
  }
  const moodEntries=ST.moods.filter(m=>days14.includes(m.date));
  const topMoodV=Object.entries(moodEntries.reduce((a,m)=>{a[m.value]=(a[m.value]||0)+1;return a},{})).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const topMood=topMoodV?MOODS.find(m=>m.v==topMoodV):null;

  // Dot trail — 14 days visual
  const dotTrail=days14.map(ds=>{
    const mood=ST.moods.filter(m=>m.date===ds).slice(-1)[0];
    const moodData=mood?MOODS.find(m=>m.v===mood.value):null;
    const hasMeals=ST.meals.some(m=>m.date===ds);
    return`<div style="display:flex;flex-direction:column;align-items:center;gap:3px">
      <div style="width:10px;height:10px;border-radius:50%;background:${moodData?moodData.c:'var(--border)'}"></div>
      ${hasMeals?`<div style="width:4px;height:4px;border-radius:50%;background:var(--green)"></div>`:`<div style="width:4px;height:4px;border-radius:50%;background:transparent"></div>`}
    </div>`;
  }).join('');

  return`<div class="screen">
    <div style="font-size:24px;font-weight:900;margin-bottom:4px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px">
      <span style="color:var(--put)">${ico('star',26)}</span>How you're doing
    </div>
    <div style="font-size:13px;color:var(--soft);margin-bottom:20px">A gentle look at the last two weeks</div>

    <div class="card" style="margin-bottom:12px;text-align:center;padding:20px 16px">
      <div style="font-size:14px;font-weight:700;color:var(--mid);line-height:1.6;max-width:280px;margin:0 auto">However these days have been, you are welcome here. Gaps are part of it.</div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div style="font-weight:900;font-size:14px;margin-bottom:12px">Last 14 days</div>
      <div style="display:flex;gap:5px;justify-content:space-between;margin-bottom:8px">${dotTrail}</div>
      <div style="display:flex;gap:10px;margin-top:4px">
        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:50%;background:var(--green)"></div><span style="font-size:11px;font-weight:700;color:var(--soft)">Mood logged</span></div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:6px;height:6px;border-radius:50%;background:var(--green)"></div><span style="font-size:11px;font-weight:700;color:var(--soft)">Meal logged</span></div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:50%;background:var(--border)"></div><span style="font-size:11px;font-weight:700;color:var(--soft)">No entry</span></div>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div style="font-weight:900;font-size:14px;margin-bottom:14px">The mood you felt most</div>
      <div style="display:flex;gap:9px">
        <div style="flex:1;background:var(--bg);border-radius:12px;padding:12px 8px;border:1px solid var(--border);text-align:center">
          ${topMood
            ?`<div style="color:${topMood.c};display:flex;justify-content:center;margin-bottom:3px">${ico(topMood.k,22)}</div><div style="font-size:11px;font-weight:800;color:${topMood.c}">${topMood.l}</div><div style="font-size:9px;color:var(--soft)">most felt</div>`
            :`<div style="font-size:22px;color:var(--border)">—</div><div style="font-size:10px;color:var(--soft);margin-top:2px">no moods yet</div>`}
        </div>

  </div>`;
}

function rJournal(){
  const allDates=[...new Set([
    ...ST.moods.map(m=>m.date),
    ...ST.nourished.map(n=>n.date),
    ...ST.meals.map(m=>m.date),
  ])].sort((a,b)=>b.localeCompare(a));

  if(!allDates.length)return`<div class="screen">
    <div style="font-size:24px;font-weight:900;margin-bottom:4px;letter-spacing:-.3px">Journal</div>
    <div style="font-size:13px;color:var(--soft);margin-bottom:24px">Your entries will appear here</div>
    <div class="empty" style="padding-top:48px">
      <div style="font-size:48px;margin-bottom:14px">🥦</div>
      <div class="et">No entries yet</div>
      <div class="es">Start by logging your mood<br>and how nourished you feel today</div>
    </div>
  </div>`;

  const fmt=ds=>{
    const isToday=ds===today();
    const isYesterday=ds===new Date(Date.now()-864e5).toISOString().split('T')[0];
    if(isToday)return'Today';
    if(isYesterday)return'Yesterday';
    return new Date(ds+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  };

  /* ── 7-day strip ── */
  const DAYS7=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const todayIdx=(new Date().getDay()+6)%7;
  const week7=DAYS7.map((l,i)=>{
    const d=new Date();d.setDate(d.getDate()-(todayIdx-i));
    const ds=d.toISOString().split('T')[0];
    const mood=ST.moods.filter(m=>m.date===ds).slice(-1)[0];
    const nour=ST.nourished.filter(n=>n.date===ds).slice(-1)[0];
    const moodData=mood?MOODS.find(m=>m.v===mood.value):null;
    const nourData=nour?NOURISHED.find(n=>n.v===nour.value):null;
    const isToday=ds===today();
    return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px">
      <div style="font-size:9px;font-weight:800;color:${isToday?'var(--text)':'var(--soft)'};text-transform:uppercase;letter-spacing:.05em">${l}</div>
      <div style="color:${moodData?moodData.c:'var(--border)'};" title="${moodData?moodData.l:''}">
        ${moodData?ico(moodData.k,18):`<svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="var(--border)"/></svg>`}
      </div>
      <div style="width:18px;height:18px;display:flex;align-items:center;justify-content:center">
        ${nourData?broccoliSvg(nourData.v,nourData.c,16):`<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="var(--border)"/></svg>`}
      </div>
    </div>`;
  }).join('');

  /* ── Stats ── */
  const last7=allDates.filter(ds=>{const diff=(Date.now()-new Date(ds+'T12:00:00').getTime())/864e5;return diff<7;});
  const moodCounts={};ST.moods.filter(m=>{const diff=(Date.now()-new Date(m.date+'T12:00:00').getTime())/864e5;return diff<7;}).forEach(m=>{moodCounts[m.value]=(moodCounts[m.value]||0)+1;});
  const topMoodV=Object.entries(moodCounts).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const topMood=topMoodV?MOODS.find(m=>m.v==topMoodV):null;
  const nourVals=ST.nourished.filter(n=>{const diff=(Date.now()-new Date(n.date+'T12:00:00').getTime())/864e5;return diff<7;}).map(n=>n.value);

  const summaryCard=`<div class="card" style="margin-bottom:14px">
    <div style="font-size:11px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px">This week</div>
    <div style="display:flex;gap:0">${week7}</div>
    <div style="border-top:1px solid var(--border);margin:12px 0"></div>
    <div style="display:flex;gap:10px">
      <div style="flex:1;background:var(--bg);border-radius:11px;padding:10px;border:1px solid var(--border);text-align:center">
        <div style="font-size:11px;font-weight:800;color:var(--soft);margin-bottom:5px">Common mood</div>
        ${topMood?`<div style="color:${topMood.c};display:flex;justify-content:center">${ico(topMood.k,22)}</div><div style="font-size:10px;font-weight:800;color:${topMood.c};margin-top:2px">${topMood.l}</div>`:`<div style="font-size:11px;color:var(--soft);margin-top:4px">—</div>`}
      </div>
      </div>
  </div>`;

  /* ── Filter chips ── */
  const fAll=jFilter.type==='all';
  const filterChips=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
    <button class="chip ${fAll?'sel':''}" onclick="jFilter={type:'all',value:null};render()">All</button>
    ${MOODS.map(m=>{const sel=jFilter.type==='mood'&&jFilter.value===m.v;return`<button style="padding:6px 11px;border-radius:100px;border:1.5px solid ${sel?m.c:' var(--border)'};background:${sel?m.c+'22':'var(--card)'};font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;color:${sel?m.c:'var(--soft)'};display:flex;align-items:center;gap:5px;transition:all .18s" onclick="jFilter={type:'mood',value:${m.v}};render()"><span style="color:${m.c}">${ico(m.k,14)}</span>${m.l}</button>`;}).join('')}
    ${NOURISHED.map(n=>{const sel=jFilter.type==='nour'&&jFilter.value===n.v;return`<button style="padding:6px 11px;border-radius:100px;border:1.5px solid ${sel?n.c:'var(--border)'};background:${sel?n.c+'22':'var(--card)'};font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;cursor:pointer;color:${sel?n.c:'var(--soft)'};display:flex;align-items:center;gap:5px;transition:all .18s" onclick="jFilter={type:'nour',value:${n.v}};render()">${broccoliSvg(n.v,sel?n.c:'var(--soft)',13)}${n.l}</button>`;}).join('')}
  </div>`;

  /* ── Filter dates ── */
  const filteredDates=allDates.filter(ds=>{
    if(jFilter.type==='all')return true;
    if(jFilter.type==='mood'){const m=ST.moods.filter(m=>m.date===ds).slice(-1)[0];return m&&m.value===jFilter.value;}
    if(jFilter.type==='nour'){const n=ST.nourished.filter(n=>n.date===ds).slice(-1)[0];return n&&n.value===jFilter.value;}
    return true;
  });

  /* ── Entry cards ── */
  const entries=filteredDates.length===0
    ?`<div class="empty"><div class="et">No entries match this filter</div><div class="es">Try a different mood or nourishment level</div></div>`
    :filteredDates.map(ds=>{
    const mood=ST.moods.filter(m=>m.date===ds).slice(-1)[0];
    const nour=ST.nourished.filter(n=>n.date===ds).slice(-1)[0];
    const dayMeals=ST.meals.filter(m=>m.date===ds);
    const moodData=mood?MOODS.find(m=>m.v===mood.value):null;
    const nourData=nour?NOURISHED.find(n=>n.v===nour.value):null;

    const moodPill=moodData?`<div style="display:flex;align-items:center;gap:6px;background:${moodData.c}18;border:1px solid ${moodData.c}40;border-radius:100px;padding:5px 10px 5px 7px"><span style="color:${moodData.c};display:flex">${ico(moodData.k,15)}</span><span style="font-size:12px;font-weight:800;color:${moodData.c}">${moodData.l}</span></div>`:'';
    const nourPill=nourData?`<div style="display:flex;align-items:center;gap:6px;background:${nourData.c}18;border:1px solid ${nourData.c}40;border-radius:100px;padding:5px 10px 5px 8px">${broccoliSvg(nourData.v,nourData.c,15)}<span style="font-size:12px;font-weight:800;color:${nourData.c}">${nourData.l}</span></div>`:'';
    const mealSummary=dayMeals.length>0?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:11px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px">${dayMeals.length} meal${dayMeals.length!==1?'s':''}</div>
        ${dayMeals.map(m=>{const mt=MT.find(t=>t.id===m.type)||MT[1];const names=m.ings.map(i=>i.food.name.split(' · ')[0]).join(', ');return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div style="width:28px;height:28px;border-radius:8px;background:${mt.bg};color:${mt.c};display:flex;align-items:center;justify-content:center;flex-shrink:0">${ico(mt.i,13)}</div><div style="min-width:0"><div style="font-size:12px;font-weight:800;color:var(--mid);text-transform:capitalize">${m.type}</div><div style="font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px">${names}</div></div></div>`;}).join('')}
      </div>`:'';

    return`<div class="card" style="margin-bottom:10px">
      <div style="font-size:13px;font-weight:900;color:var(--mid);margin-bottom:10px">${fmt(ds)}</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        ${moodPill}${nourPill}
        ${!moodPill&&!nourPill?`<span style="font-size:12px;color:var(--soft)">No mood or nourishment logged</span>`:''}
      </div>
      ${mealSummary}
    </div>`;
  }).join('');

  return`<div class="screen">
    <div style="font-size:24px;font-weight:900;margin-bottom:4px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px">
      <span style="background:linear-gradient(135deg,#4DD871,#FFD166);-webkit-background-clip:text;-webkit-text-fill-color:transparent">${ico('journal',26)}</span>Journal
    </div>
    <div style="font-size:13px;color:var(--soft);margin-bottom:16px">Your days, at a glance</div>
    ${summaryCard}
    ${filterChips}
    ${entries}
  </div>`;
}

function lockTimeText(ms){
  const d=new Date(ms),now=new Date();
  const t=d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
  return d.toDateString()===now.toDateString()?t:`tomorrow at ${t}`;
}
function rNumbersControl(){
  const note=t=>`<div style="font-size:13px;color:var(--mid);line-height:1.6;margin-top:10px">${t}</div>`;
  const btn=(label,fn,cls='btn-o')=>`<button class="btn ${cls}" style="margin-top:10px" ${lockUi.busy?'disabled':''} onclick="${fn}">${label}</button>`;
  const err=lockUi.err?`<div class="err-box" style="margin-top:10px">${lockUi.err}</div>`:'';
  if(!LOCK.loaded)return note('The lock could not be checked right now, so numbers stay hidden.')+btn('Try again',"loadLock().then(()=>render())");
  if(LOCK.on)return note('Numbers are on.')+btn('Turn numbers off','turnNumbersOff()')+err;
  const rr=resetRemainingMs();
  if(rr!==null){
    if(rr<=0)return note('The waiting time is over. Choose a new safe word.')
      +`<input class="inp" type="password" autocomplete="off" style="margin-top:10px" value="${lockUi.word.replace(/"/g,'&quot;')}" oninput="lockUi.word=this.value" placeholder="New safe word">`
      +`<input class="inp" type="password" autocomplete="off" style="margin-top:8px" value="${lockUi.word2.replace(/"/g,'&quot;')}" oninput="lockUi.word2=this.value" placeholder="Once more">`
      +btn('Save new safe word','finishReset()','btn-g')+btn('Keep my old one','cancelReset()')+err;
    return note(`You can choose a new safe word from ${lockTimeText(LOCK.resetAt)}. Numbers stay off until then.`)+btn('I remembered it, cancel','cancelReset()')+err;
  }
  const forgot=`<button style="background:none;border:none;color:var(--soft);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;margin-top:12px;padding:0" ${lockUi.busy?'disabled':''} onclick="startReset()">I forgot my safe word</button>`;
  const rem=lockRemainingMs();
  if(rem!==null){
    if(rem<=0)return note('Your 2 hours have passed. You can turn numbers on now, or leave them off.')+btn('Turn numbers on','confirmNumbersOn()','btn-g')+btn('Leave them off','cancelUnlock()')+err;
    return note(`Numbers can be turned on from ${lockTimeText(LOCK.unlockAt)}. Nothing to do until then.`)+btn('Cancel','cancelUnlock()')+err;
  }
  if(lockUi.open)return note('Enter your safe word to start the 2-hour wait.')
    +`<input class="inp" type="password" autocomplete="off" style="margin-top:10px" value="${lockUi.word.replace(/"/g,'&quot;')}" oninput="lockUi.word=this.value" placeholder="Safe word">`
    +btn('Start the 2-hour wait','requestUnlock()','btn-g')+btn('Cancel',"lockUi.open=false;lockUi.word='';lockUi.err='';render()")+forgot+err;
  return note('Numbers are off.')+btn('Turn numbers on…','lockUi.open=true;render()')+err;
}

        <svg width="36" height="36" viewBox="0 0 80 80">

          <circle cx="40" cy="40" r="38" fill="#1E1A0D" stroke="#FF8C69" stroke-width="1" stroke-opacity=".2"/>
          <path d="M40 59C40 59 21 47 21 33c0-8 6.5-13 13-10 3 1.4 4.5 3.5 6 5.5 1.5-2 3-4.1 6-5.5 6.5-3 13 2 13 10 0 14-19 26-19 26z" fill="url(#slogo)" fill-opacity=".28" stroke="url(#slogo)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="40" y1="59" x2="40" y2="43" stroke="#4DD871" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div>
          <div style="font-size:15px;font-weight:900;background:linear-gradient(135deg,#4DD871,#FFD166,#FF8C69);-webkit-background-clip:text;-webkit-text-fill-color:transparent">Nourish</div>
          <div style="font-size:11px;color:var(--soft);font-weight:700">Food, without the noise.</div>
        </div>
      </div>
      <div style="padding:13px 0;font-size:12px;color:var(--soft);line-height:1.7">Built with care for people rebuilding their relationship with food. This app is a companion, not a clinician — always work alongside your care team.</div>
    </div>

  </div>`;
}

function render(){
  const app=$('app'),n=$('nav');
  if(appLoading){
    app.innerHTML=`<div class="loading-screen">
      ${rLogo(64)}
      <span class="spin"></span>
    </div>`;
    n.innerHTML='';return;
  }
  if(!authUser){app.innerHTML=authScreen==='register'?rRegister():rLogin();n.innerHTML='';return;}
  if(LOCK.loaded&&!LOCK.has){app.innerHTML=rSafeWord();n.innerHTML='';return;}
  if(!onboarded){app.innerHTML=rOnboarding();n.innerHTML='';return;}
  switch(ST.scr){
    case'home':app.innerHTML=rHome();break;
    case'add':app.innerHTML=rAdd();break;
    case'scan':app.innerHTML=rScan();break;
    case'insights':app.innerHTML=rInsights();break;
    case'journal':app.innerHTML=rJournal();break;
    case'settings':app.innerHTML=rSettings();break;
  }
  n.innerHTML=`
    <button class="nb ${ST.scr==='home'?'on':''}" onclick="nav('home')" style="color:${ST.scr==='home'?'var(--green)':'var(--soft)'}">${ico('home',22)}Home</button>
    <button class="nb ${ST.scr==='journal'?'on':''}" onclick="nav('journal')" style="color:${ST.scr==='journal'?'#FFD166':'var(--soft)'}">${ico('journal',22)}Journal</button>
    <button class="fab" onclick="nav('add')" aria-label="Add meal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5V19M5 12H19"/></svg></button>
    <button class="nb ${ST.scr==='insights'?'on':''}" onclick="nav('insights')" style="color:${ST.scr==='insights'?'var(--put)':'var(--soft)'}">${ico('star',22)}Insights</button>
    <button class="nb ${ST.scr==='settings'?'on':''}" onclick="nav('settings')" style="color:${ST.scr==='settings'?'var(--coral)':'var(--soft)'}">${ico('settings',22)}Settings</button>
  `;
}
// ── Bootstrap: check for existing Supabase session ──
(async()=>{
  render(); // show loading screen immediately
  const{data:{session}}=await supa.auth.getSession();
  if(session){
    await afterSignIn(session.user);
  }
  appLoading=false;
  render();
})();

// Keep in sync across tabs
supa.auth.onAuthStateChange(async(event,session)=>{
  if(event==='SIGNED_OUT'){authUser=null;showNums=false;LOCK.loaded=false;ST.meals=[];ST.moods=[];ST.nourished=[];CF=[];RCP=[];appLoading=false;render();}
});
</script></body></html>
